spring.application.name=quanlydaotao

# Database
# - Local: mặc định dùng SQL Server bên dưới
# - Railway: ghi đè bằng biến môi trường SPRING_DATASOURCE_* (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=quanlysinhvien;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123123}

# JPA / Hibernate
# Local: none | Railway: đặt DDL_AUTO=update để tự tạo bảng lần đầu
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}
server.tomcat.uri-encoding=UTF-8

# Encoding / JSON
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always