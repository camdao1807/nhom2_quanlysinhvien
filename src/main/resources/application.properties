
spring.application.name=quanlydaotao

# Database
# Local: SQL Server
# Render: PostgreSQL thông qua biến môi trường
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=quanlysinhvien;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD:admin123}
# PostgreSQL Schema trên Render
spring.jpa.properties.hibernate.default_schema=dbo

# Server
server.port=${PORT:8080}
server.tomcat.uri-encoding=UTF-8

# Encoding / JSON
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
